<form action="{% url 'new_batch' %}" method="post" class="batch-form">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
  <div class="field {% if field.name == 'fail_first' %}check{% endif %}">
    {% if field.name == 'fail_first' %}{{ field }}{{ field.label_tag }}{% else %}{{ field.label_tag }}{{ field }}{% endif %}
    {{ field.errors }}
  </div>
  {% endfor %}
  <button class="button primary wide" type="submit"><span aria-hidden="true">+</span> Кезекке жіберу</button>
</form>
